[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognivoy-cli"
dynamic = ["version"]
description = "CLI-only distribution for Cognivoy"
authors = [{name = "Cognivoy contributors"}]
maintainers = [{name = "chenchunrun", email = "chenchunrun@live.com"}]
keywords = ["ai", "education", "learning", "agents", "rag", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
# Capped below 3.14 to match the main `cognivoy` package (issue #664): 3.14
# lacks wheels for some compiled base deps (e.g. faiss-cpu), so pip falls back
# to a source build that fails. Refuse 3.14 cleanly instead.
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
    "MODIFICATIONS.md",
    "THIRD_PARTY_NOTICES.md",
    "ASSET_PROVENANCE.md",
]
dependencies = [
    "PyYAML>=6.0",
    "jinja2>=3.1.0",
    "openai>=1.30.0",
    "tiktoken>=0.5.0",
    "aiohttp>=3.9.4",
    "httpx>=0.27.0",
    "requests>=2.32.2",
    "ddgs>=9.9.1",
    "nest_asyncio>=1.5.8",
    "tenacity>=8.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "packaging>=24.0",
    "aiosqlite>=0.19.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.36",
    "anthropic>=0.30.0",
    "dashscope>=1.14.0",
    "perplexityai>=0.1.0",
    "oauth-cli-kit>=0.1.1",
    "PyMuPDF>=1.26.0",
    "numpy>=1.24.0,<3.0.0",
    "arxiv>=2.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "pypdf>=6.20.1",
    "multidict>=6.9.1,<7.0.0",
    "urllib3>=2.8.0,<3.0.0",
    "defusedxml>=0.7.1",
]

[project.scripts]
cognivoy = "cognivoy_cli.main:main"

[project.urls]
Homepage = "https://github.com/chenchunrun/Cognivoy"
Documentation = "https://github.com/chenchunrun/Cognivoy#readme"
Repository = "https://github.com/chenchunrun/Cognivoy.git"
Issues = "https://github.com/chenchunrun/Cognivoy/issues"
Changelog = "https://github.com/chenchunrun/Cognivoy/blob/main/CHANGELOG.md"
Security = "https://github.com/chenchunrun/Cognivoy/security/policy"

[project.optional-dependencies]
rag-llamaindex = [
    "llama-index-core>=0.14.12",
    "llama-index-retrievers-bm25>=0.7.1,<0.8.0",
    "llama-index-vector-stores-faiss>=0.4.0,<1.0.0",
    "faiss-cpu>=1.8.0,<2.0.0",
]

[tool.setuptools]
package-dir = {"" = "../.."}
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "cognivoy.__version__.__version__"}

[tool.setuptools.packages.find]
where = ["../.."]
include = ["cognivoy*", "cognivoy_cli*"]
exclude = ["cognivoy_web*"]

# This distribution includes the shared agent implementations. Keep their
# runtime prompt/config assets in the wheel as the full distribution does.
[tool.setuptools.package-data]
cognivoy = [
    "**/*.yaml",
    "**/*.yml",
    "**/*.md",
    "**/*.json",
    "**/*.sh",
    "**/*.j2",
    "**/*.jinja",
]
cognivoy_cli = ["**/*.md"]
