name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "Dockerfile.*"
      - "cognivoy/**"
      - "cognivoy_cli/**"
      - "tests/**"
      - "requirements/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "packaging/**"
      - "scripts/check_open_source_readiness.py"
      - "LICENSE"
      - "NOTICE"
      - "MODIFICATIONS.md"
      - "THIRD_PARTY_NOTICES.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "GOVERNANCE.md"
      - "CHANGELOG.md"
      - "ASSET_POLICY.md"
      - "ASSET_PROVENANCE.md"
      - "UPSTREAM.md"
      - "web/**"
      - ".github/**"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "Dockerfile.*"
      - "cognivoy/**"
      - "cognivoy_cli/**"
      - "tests/**"
      - "requirements/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "packaging/**"
      - "scripts/check_open_source_readiness.py"
      - "LICENSE"
      - "NOTICE"
      - "MODIFICATIONS.md"
      - "THIRD_PARTY_NOTICES.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "GOVERNANCE.md"
      - "CHANGELOG.md"
      - "ASSET_POLICY.md"
      - "ASSET_PROVENANCE.md"
      - "UPSTREAM.md"
      - "web/**"
      - ".github/**"

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.0

      - name: Run Ruff lint
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Check open-source readiness
        run: python scripts/check_open_source_readiness.py

  web-tests:
    name: Web Quality and Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      COGNIVOY_API_BASE_URL: http://127.0.0.1:8001
      COGNIVOY_AUTH_ENABLED: "false"
      NEXT_PUBLIC_AUTH_ENABLED: "false"
      BASE_URL: http://127.0.0.1:3783

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install browser-test backend dependencies
        run: python -m pip install -r requirements/server.txt

      - name: Run complete frontend checks
        working-directory: web
        run: npm run check

      - name: Build production frontend and enforce resource budgets
        working-directory: web
        run: npm run build:perf

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run production browser journeys
        shell: bash
        env:
          COGNIVOY_HOME: ${{ runner.temp }}/cognivoy-ci
        run: |
          mkdir -p "$COGNIVOY_HOME"
          # Match the production launcher's idle timeout so Node's proxy pool
          # retires sockets before uvicorn (the shared 5s default races reuse).
          python -m uvicorn cognivoy.api.main:app --host 127.0.0.1 --port 8001 --timeout-keep-alive 300 > "$RUNNER_TEMP/cognivoy-api.log" 2>&1 &
          api_pid=$!
          cp -R web/.next/static web/.next/standalone/.next/static
          cp -R web/public web/.next/standalone/public
          PORT=3783 HOSTNAME=127.0.0.1 node web/.next/standalone/server.js > "$RUNNER_TEMP/cognivoy-web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            kill -0 "$api_pid" "$web_pid"
            if curl --fail --silent --max-time 3 http://127.0.0.1:8001/api/v1/health/identity > /dev/null && curl --fail --silent --max-time 3 "$BASE_URL/home" > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          npm --prefix web run test:e2e:release

      - name: Preserve browser-test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-quality-diagnostics
          path: |
            ${{ runner.temp }}/cognivoy-api.log
            ${{ runner.temp }}/cognivoy-web.log
            web/test-results/
          retention-days: 7

  import-check:
    name: Import Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - python-version: "3.14"
            experimental: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements/server.txt', 'requirements/cli.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install minimal dependencies for import check
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt

      - name: Check module imports
        run: |
          echo "🐍 Testing with Python ${{ matrix.python-version }}"
          python -c "from cognivoy.runtime.orchestrator import ChatOrchestrator; print('✅ Orchestrator imports OK')"
          python -c "from cognivoy.runtime.registry.tool_registry import get_tool_registry; print('✅ Tool registry imports OK')"
          python -c "from cognivoy.runtime.registry.capability_registry import get_capability_registry; print('✅ Capability registry imports OK')"
          python -c "from cognivoy.services.config.runtime_settings import RuntimeSettingsService; print('✅ RuntimeSettingsService imports OK')"
          python -c "from cognivoy.api.routers.unified_ws import unified_websocket; print('✅ Unified WS imports OK')"
          python -c "from cognivoy.services.prompt.manager import PromptManager; print('✅ Prompt manager imports OK')"
          python -c "from cognivoy.logging import configure_logging, bind_log_context, capture_process_logs, ProcessLogEvent; print('✅ Logging imports OK')"
        env:
          PYTHONPATH: ${{ github.workspace }}

  python-tests:
    name: Python Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: import-check
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - python-version: "3.14"
            experimental: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements/server.txt', 'requirements/cli.txt', 'requirements/partners.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install smoke test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/server.txt
          pip install -r requirements/partners.txt
          pip install -r requirements/rag-llamaindex.txt
          pip install pytest pytest-asyncio

      - name: Create minimal runtime config
        run: |
          mkdir -p data/user/settings
          cat > data/user/settings/main.yaml <<'YAML'
          system:
            language: en
          logging:
            level: WARNING
          YAML

      - name: Run Python tests
        run: |
          echo "🧪 Running Python tests on Python ${{ matrix.python-version }}"
          pytest -q tests cognivoy/learning/tests
        env:
          PYTHONPATH: ${{ github.workspace }}

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, web-tests, import-check, python-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint and format | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web checks, production build, budgets and browser journeys | ${{ needs.web-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Import check (3.11/3.12/3.13; 3.14 best-effort) | ${{ needs.import-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python tests (3.11/3.12/3.13; 3.14 best-effort) | ${{ needs.python-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if tests failed
        if: needs.lint.result == 'failure' || needs.web-tests.result == 'failure' || needs.import-check.result == 'failure' || needs.python-tests.result == 'failure'
        run: exit 1
