name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Keep the scanner's default rules and apply only the reviewed
          # allowlist for detect-secrets' one-way-hash baseline.
          GITLEAKS_CONFIG: .gitleaks.toml

  bandit:
    name: Python static security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install bandit[toml]==1.9.4
      - run: bandit -c pyproject.toml -r cognivoy cognivoy_cli

  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1 uv==0.9.26
      - name: Export default locked dependency set
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output /tmp/cognivoy-default-requirements.txt
      - name: Audit default locked dependency set
        run: pip-audit -r /tmp/cognivoy-default-requirements.txt --no-deps --disable-pip --progress-spinner off
      - name: Audit supported server dependency set
        run: >-
          pip-audit -r requirements/server.txt --progress-spinner off

  web-dependencies:
    name: Web production dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
